name: Release

# Dispara em duas situações, de propósito — nada roda em push comum:
#   1. tag "v*" (ex.: v0.1.0) — cria a Release automaticamente
#   2. botão manual (Actions → Release → Run workflow) — pra testar sem
#      precisar criar uma tag, dry run sem publicar nada
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon — mesma arquitetura da runner
            pack: pack:mac
            artifact: mac-arm64
          - os: windows-latest
            pack: pack:win
            artifact: windows
          - os: ubuntu-latest
            pack: pack:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototypes/electron-shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, não 20: "npm test" usa --experimental-strip-types, que só
          # existe a partir do Node 22.6. Node 20 falha com exit code 9
          # (flag desconhecida) — foi exatamente o que quebrou o primeiro
          # release nos 3 SOs, e só não apareceu local porque a máquina de
          # dev já tinha Node 22 instalado.
          node-version: 22

      - run: npm ci

      - run: npm test

      - run: npx tsc -b

      - run: npm run ${{ matrix.pack }}

      # macOS: garantir assinatura ad-hoc do bundle inteiro. Sem isso o
      # Electron fica com linker-signed incompleto e o Gatekeeper, ao baixar
      # o zip, mostra "danificado… mover para o Lixo".
      - name: Ad-hoc sign + zip .app (macOS)
        if: matrix.os == 'macos-14'
        run: |
          APP="release/mac-arm64/ProShow.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xattr -cr "$APP" || true
          cd release/mac-arm64
          ditto -c -k --sequesterRsrc --keepParent ProShow.app ProShow-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: proshow-${{ matrix.artifact }}
          path: |
            prototypes/electron-shell/release/**/*.zip
            prototypes/electron-shell/release/*.exe
            prototypes/electron-shell/release/*.AppImage
          if-no-files-found: error

  publish:
    # Só cria a Release de verdade quando disparado por tag — o botão
    # manual builda e sobe os artifacts pra inspeção, sem publicar nada.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Sem isto, o GITHUB_TOKEN padrão é só leitura e a Release falha com
    # "Resource not accessible by integration" — foi o que quebrou a
    # primeira tentativa depois que os 3 builds já tinham passado.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
